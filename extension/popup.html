<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JDC Socials Publisher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #111827;
      background: #fff;
    }
    .header {
      background: #6366f1;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .logo {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header p { font-size: 11px; opacity: 0.8; }

    .body { padding: 16px; }

    /* Login form */
    .login-form { display: flex; flex-direction: column; gap: 12px; }
    .login-form label { font-size: 12px; font-weight: 500; color: #374151; display: block; margin-bottom: 4px; }
    .login-form input {
      width: 100%; padding: 8px 10px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 13px; outline: none;
      transition: border-color 0.15s;
    }
    .login-form input:focus { border-color: #6366f1; }
    .btn {
      width: 100%; padding: 9px; background: #6366f1; color: white;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn-outline {
      background: white; color: #6366f1; border: 1px solid #6366f1;
    }
    .btn-outline:hover { background: #eef2ff; }
    .error { color: #dc2626; font-size: 12px; padding: 8px 10px; background: #fef2f2; border-radius: 6px; }

    /* Status view */
    .status-card {
      background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 14px; margin-bottom: 12px;
    }
    .status-card .label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .status-card .value { font-size: 14px; font-weight: 600; color: #111827; }
    .status-card .email { font-size: 12px; color: #6366f1; font-weight: 500; }

    .pending-count {
      display: flex; align-items: center; justify-content: space-between;
      background: #eef2ff; border-radius: 10px; padding: 12px 14px;
      margin-bottom: 12px;
    }
    .pending-count .num { font-size: 28px; font-weight: 700; color: #6366f1; }
    .pending-count .txt { font-size: 12px; color: #4338ca; }

    .platforms { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .platform-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; background: #f9fafb; border-radius: 8px;
      font-size: 12px; color: #374151;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-ok { background: #22c55e; }
    .dot-warn { background: #f59e0b; }

    .actions { display: flex; flex-direction: column; gap: 8px; }
    .divider { height: 1px; background: #e5e7eb; margin: 12px 0; }

    .note {
      font-size: 11px; color: #6b7280; background: #fffbeb;
      border: 1px solid #fde68a; border-radius: 6px; padding: 8px 10px;
      line-height: 1.5; margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin: 14px 0 8px;
    }
    .configure-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 8px; margin-bottom: 6px;
    }
    .configure-row .plabel { font-size: 13px; font-weight: 500; }
    .configure-row .pstatus { font-size: 11px; }
    .pstatus.ok { color: #16a34a; }
    .pstatus.warn { color: #d97706; }
    .btn-sm {
      padding: 4px 10px; font-size: 11px; font-weight: 600;
      background: #eef2ff; color: #4f46e5; border: none;
      border-radius: 6px; cursor: pointer;
    }
    .btn-sm:hover { background: #e0e7ff; }

    #view-login, #view-status { display: none; }
    #view-login.active, #view-status.active { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">S</div>
    <div>
      <h1>JDC Socials</h1>
      <p>Auto Publisher</p>
    </div>
  </div>

  <div class="body">
    <!-- Login view -->
    <div id="view-login">
      <div class="login-form">
        <div>
          <label>Email</label>
          <input type="email" id="email" placeholder="you@company.com" />
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" />
        </div>
        <div id="login-error" class="error" style="display:none"></div>
        <button class="btn" id="login-btn">Sign in</button>
      </div>
    </div>

    <!-- Status view -->
    <div id="view-status">
      <div class="status-card">
        <div class="label">Signed in as</div>
        <div class="email" id="status-email">—</div>
      </div>

      <div class="pending-count">
        <div>
          <div class="num" id="pending-num">0</div>
          <div class="txt">posts due now</div>
        </div>
        <div style="font-size:11px;color:#4338ca;text-align:right;max-width:120px;line-height:1.4">
          Checks every minute automatically
        </div>
      </div>

      <div class="note" id="instagram-note" style="display:none">
        ⚠ Instagram captions will be copied to clipboard — you'll need to paste them manually after selecting your image.
      </div>

      <div class="platforms" id="platform-list"></div>

      <div class="section-title">Platform Setup</div>
      <div id="configure-list"></div>

      <div class="actions">
        <button class="btn" id="check-now-btn">Check & Publish Now</button>
        <button class="btn btn-outline" id="logout-btn">Sign out</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
